name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install

      - name: Lint webview HTML/JS syntax
        run: |
          node -e "
            const { webviewHtml } = require('./webviewHtml.ts');
            const scripts = [...webviewHtml.matchAll(/<script(?![^>]*src=)[^>]*>([\s\S]*?)<\/script>/g)].map(m => m[1]);
            let bad = 0;
            scripts.forEach((s, i) => {
              try { new Function(s); console.log('webview script #'+i+' OK'); }
              catch (e) {
                console.error('webview script #'+i+' SYNTAX ERROR:', e.message);
                bad++;
              }
            });
            if (bad > 0) process.exit(1);
          "

      - name: Expo prebuild (generate android/)
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK (JS bundle inclus, signé debug-key)
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/mia-tracker.apk
          cp android/app/build/outputs/apk/release/app-release.apk out/mia-tracker-${{ github.sha }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mia-tracker-apk
          path: app/out/*.apk
          retention-days: 30

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ${{ github.workspace }}
        run: |
          gh release delete nightly --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create nightly \
            app/out/mia-tracker.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Nightly · ${GITHUB_SHA::7}" \
            --notes "Build automatique depuis le commit ${GITHUB_SHA::7}.

          URL stable : https://github.com/$GITHUB_REPOSITORY/releases/download/nightly/mia-tracker.apk" \
            --prerelease

      - name: Summary
        run: |
          echo "### APK construit ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Téléchargement direct (sans login GitHub) :**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/${{ github.repository }}/releases/download/nightly/mia-tracker.apk" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls -lh out/ >> $GITHUB_STEP_SUMMARY
